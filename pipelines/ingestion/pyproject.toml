[project]
name = "telecom-support-ingestion"
version = "0.1.0"
description = "Talkmap telecom conversation ingestion pipeline"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/loader.py", "src/models.py"]
mypy_path = "src"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["loader", "models"]

package-dir = {"" = "src"}